[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-pyephem"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
data = "bash build/data.sh"
test = "python -m pytest tests -q"
# OPENBLAS_NUM_THREADS=1 is not a tuning choice: this host caps threads per
# process at ~70, numpy's default pool wants one per logical CPU, and OpenBLAS
# then hangs retrying pthread_create at import. Neither side of the comparison
# uses BLAS, so a single thread costs nothing and keeps the run reproducible.
bench = "flock /tmp/mojo-bench.lock env OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092905"
max = "==26.7.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
ephem = "*"
